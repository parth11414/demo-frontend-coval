      (function() {
        try {
          var saved = localStorage.getItem('coval_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();

    <div class="app-shell">
      <!-- Mobile drawer overlay backdrop -->

      <!-- 1. SIDEBAR -->
      <aside class="sidebar" id="sidebar" aria-label="Application Sidebar">
        <!-- Top: Logo, Name, Descriptor -->
        <div class="sidebar-brand-block">
          <a class="brand" href="#overview" data-route="overview" aria-label="COVAL home">
<span class="brand-mark" aria-hidden="true">
    <img src="coval-logo-light.jpg"
         alt="COVAL Solutions"
         class="brand-logo brand-logo-light"
         width="36"
         height="36">

    <img src="coval-logo-dark.jpg"

         class="brand-logo brand-logo-dark"
         width="36"
         height="36">
</span>
            <div class="brand-text">
              <span class="brand-name">COVAL</span>
              <span class="brand-desc">ENGINEERING INTELLIGENCE</span>
            </div>

          <div class="workspace-chip">
            <span class="workspace-avatar" aria-hidden="true">A</span>
            <div class="workspace-meta">
              <span class="workspace-name">Atlas Labs</span>
              <span class="workspace-env">WORKSPACE / PROD</span>
            </div>
            <span class="workspace-status" title="Connected to production workspace"><i></i></span>
          </div>
        </div>

          <span class="sidebar-section-heading">NAVIGATION</span>
          <nav class="main-nav" aria-label="Primary Navigation">
            <a class="nav-link active" href="#overview" data-route="overview">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-layout"></use></svg></span>
              <span class="nav-label">Overview</span>
              <kbd class="nav-kbd">⌘1</kbd>
            </a>
            <a class="nav-link" href="#engineering" data-route="engineering">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg></span>
              <span class="nav-label">People</span>
              <span class="nav-count">12</span>
            </a>
            <a class="nav-link" href="#projects" data-route="projects">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg></span>
              <span class="nav-label">Projects</span>
              <span class="nav-count" id="projectCount">12</span>
            </a>
            <a class="nav-link" href="#network" data-route="network">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-network"></use></svg></span>
              <span class="nav-label">Network</span>
            </a>
            <a class="nav-link" href="#activity" data-route="activity">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-activity"></use></svg></span>
              <span class="nav-label">Activity</span>
            </a>
            <a class="nav-link" href="#chat" data-route="chat">
              <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-message"></use></svg></span>
              <span class="nav-label">Messages</span>
              <span class="online-dot" title="Local messaging active"></span>
            </a>
          </nav>

          <!-- Pinned Repositories List -->
          <div class="sidebar-pinned-section">
            <div class="sidebar-section-heading">
              <span>PINNED PROJECTS</span>
              <button class="tiny-action" aria-label="Explore projects" data-go="projects" title="Explore all projects">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
              </button>
            </div>
            <div id="pinnedProjects" class="pinned-projects-list"></div>
          </div>

          <!-- Teams & Guilds Section -->
          <div class="sidebar-pinned-section">
            <div class="sidebar-section-heading">
              <span>TEAMS & GUILDS</span>
              <button class="tiny-action" aria-label="Explore network" data-go="network" title="Explore engineering graph">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg>
              </button>
            </div>
            <div class="pinned-projects-list">
              <button class="pinned-project" data-team-jump="Applied AI">
                <i class="pinned-dot" style="background:#06b6d4;border-color:#06b6d4"></i>
                <span class="pinned-name">Applied AI</span>
                <span class="pinned-stars">4 devs</span>
              </button>
              <button class="pinned-project" data-team-jump="Platform">
                <i class="pinned-dot" style="background:#6366f1;border-color:#6366f1"></i>
                <span class="pinned-name">Platform</span>
                <span class="pinned-stars">4 devs</span>
              </button>
              <button class="pinned-project" data-team-jump="Developer Experience">
                <i class="pinned-dot" style="background:#10b981;border-color:#10b981"></i>
                <span class="pinned-name">Dev Experience</span>
                <span class="pinned-stars">2 devs</span>
              </button>
              <button class="pinned-project" data-team-jump="Trust & Security">
                <i class="pinned-dot" style="background:#f59e0b;border-color:#f59e0b"></i>
                <span class="pinned-name">Trust & Security</span>
                <span class="pinned-stars">1 dev</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Bottom: Settings, Theme control, Current User Profile -->
        <div class="sidebar-bottom">
          <div class="sidebar-quick-actions">
            <button class="sidebar-action-btn" id="sidebarSettingsBtn" aria-label="Open Settings" title="Settings">
              <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
              <span>Settings</span>
            </button>
            <button class="sidebar-action-btn theme-toggle-btn" id="sidebarThemeToggle" aria-label="Toggle theme mode" title="Toggle dark/light theme">
              <svg class="icon icon-theme-toggle" aria-hidden="true"><use href="#i-moon"></use></svg>
              <span class="theme-btn-label">Theme</span>
            </button>
          </div>

          <button class="self-profile" data-person="maya-chen" aria-label="Maya Chen Profile">
            <span class="avatar avatar-maya">MC</span>
            <div class="self-profile-info">
              <strong>Maya Chen</strong>
              <small>Staff Engineer</small>
            </div>
            <span class="profile-more" title="View profile" aria-hidden="true">
              <svg class="icon"><use href="#i-chevron-right"></use></svg>
            </span>
          </button>
        </div>
      </aside>

      <!-- 2. MAIN AREA & TOP BAR -->
      <main class="main-area">
        <header class="topbar">
          <!-- Left: Mobile Menu & Breadcrumbs -->
          <div class="topbar-left">
            <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation menu">
              <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
            </button>
            <div class="breadcrumbs">
              <span class="breadcrumb-root">ATLAS LABS</span>
              <span class="crumb-sep">/</span>
              <strong id="breadcrumb">OVERVIEW</strong>
            </div>
          </div>

          <!-- Center: Global Search Bar Trigger with ⌘K & Sleek Dark Mode Switch -->
          <div class="topbar-center">
            <button class="topbar-search-btn" id="globalSearchButton" aria-label="Search directory (Press ⌘K)">
              <span class="search-btn-icon" aria-hidden="true">
                <svg class="icon"><use href="#i-search"></use></svg>
              </span>
              <span class="search-btn-text">Search directory, projects, teams…</span>
              <span class="search-btn-kbd" aria-hidden="true">
                <kbd>⌘</kbd><kbd>K</kbd>
              </span>
            </button>

            <!-- Sleek Dark Mode Toggle Switch -->
            <button class="theme-switch-control" id="themeSwitchControl" role="switch" aria-checked="false" aria-label="Toggle dark mode" title="Toggle dark mode">
              <span class="switch-glyph switch-sun" aria-hidden="true">
                <svg class="icon"><use href="#i-sun"></use></svg>
              </span>
              <span class="switch-track" aria-hidden="true">
                <span class="switch-thumb">
                  <svg class="icon thumb-sun"><use href="#i-sun"></use></svg>
                  <svg class="icon thumb-moon"><use href="#i-moon"></use></svg>
                </span>
              </span>
              <span class="switch-glyph switch-moon" aria-hidden="true">
                <svg class="icon"><use href="#i-moon"></use></svg>
              </span>
              <span class="switch-mode-text" id="switchModeText">Dark</span>
            </button>
          </div>

          <!-- Right: System Status, Notifications, Theme Toggle, User Avatar -->
          <div class="topbar-right">
            <span class="system-status" title="All engineering systems operational">
              <i></i> NOMINAL
            </span>

            <button class="top-icon topbar-notifications" id="notificationsButton" aria-label="Notifications" title="Recent activity notifications (3 unread)">
              <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg>
              <span class="notification-badge" aria-hidden="true"></span>
            </button>

            <button class="top-icon topbar-theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle theme">
              <svg class="icon theme-icon-current" aria-hidden="true"><use href="#i-moon"></use></svg>
            </button>

            <span class="top-divider" aria-hidden="true"></span>

            <span class="top-date" id="liveClock" aria-label="Current date"></span>

            <button class="topbar-user-btn" data-person="maya-chen" aria-label="Maya Chen Profile" title="Maya Chen (Staff Engineer)">
              <span class="avatar avatar-maya avatar-small">MC</span>
            </button>
          </div>
        </header>

        <!-- 3. MAIN CONTENT CONTAINER -->
        <div class="content-wrap">
          <div id="viewRoot" aria-live="polite"></div>
        </div>

        <footer class="footer">
          <span>COVAL <b>v1.0</b></span>
          <span>ENGINEERING INTELLIGENCE <i>•</i> ATLAS LABS</span>
        </footer>
      </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast" id="toast" role="status"></div>

    <!-- Accessible Modal Container -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="Close dialog">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
        <div id="modalContent"></div>
      </section>
    </div>

    <script src="app.js?v=20261004b"></script>
